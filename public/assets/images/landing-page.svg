  <rect x="200" y="275" width="192" height="46" rx="23" fill="url(#g1)"/>
  <rect x="230" y="286" width="132" height="11" rx="4" fill="#0F1923" opacity="0.7"/>

  <rect x="408" y="275" width="192" height="46" rx="23" fill="#1E2A38" stroke="#56CCF2" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="438" y="286" width="132" height="11" rx="4" fill="#A0AEC0" opacity="0.55"/>

