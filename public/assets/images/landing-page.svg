<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="b1" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="15%" cy="80%" r="38%">
      <stop offset="0%" stop-color="#56CCF2" stop-opacity="0.09"/>
