  <rect x="196" y="352" width="70" height="24" rx="5" fill="#253345"/>
  <rect x="282" y="352" width="70" height="24" rx="5" fill="#253345"/>
  <rect x="368" y="352" width="70" height="24" rx="5" fill="#253345"/>
  <rect x="454" y="352" width="70" height="24" rx="5" fill="#253345"/>
  <rect x="211" y="361" width="40" height="7" rx="2" fill="#A0AEC0" opacity="0.35"/>
