<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#56CCF2" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#56CCF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0F1923"/>
  <rect width="800" height="450" fill="url(#b1)"/>

  <!-- Nav bar -->
  <rect width="800" height="52" fill="#1E2A38"/>
  <rect y="51" width="800" height="1" fill="#F7FAFC" opacity="0.05"/>
  <!-- Logo -->
  <rect x="24" y="16" width="20" height="20" rx="4" fill="#56CCF2"/>
  <rect x="52" y="20" width="80" height="11" rx="3" fill="#F7FAFC" opacity="0.8"/>
  <!-- Cart icon -->
  <rect x="718" y="16" width="20" height="20" rx="4" fill="#253345"/>
  <circle cx="728" cy="26" r="6" fill="none" stroke="#56CCF2" stroke-width="1.5"/>
  <circle cx="728" cy="14" r="4" fill="#7B61FF"/>

  <!-- Category tabs -->
  <rect width="800" height="38" y="52" fill="#253345"/>
  <rect x="40" y="63" width="52" height="16" rx="8" fill="#56CCF2" opacity="0.9"/>
  <rect x="48" y="68" width="36" height="7" rx="2" fill="#0F1923" opacity="0.7"/>
  <rect x="108" y="63" width="64" height="16" rx="8" fill="none"/>
  <rect x="116" y="68" width="48" height="7" rx="2" fill="#A0AEC0" opacity="0.5"/>
  <rect x="188" y="63" width="64" height="16" rx="8" fill="none"/>
  <rect x="196" y="68" width="48" height="7" rx="2" fill="#A0AEC0" opacity="0.5"/>
  <rect x="268" y="63" width="64" height="16" rx="8" fill="none"/>
  <rect x="276" y="68" width="48" height="7" rx="2" fill="#A0AEC0" opacity="0.5"/>
  <rect x="348" y="63" width="80" height="16" rx="8" fill="none"/>
  <rect x="356" y="68" width="64" height="7" rx="2" fill="#A0AEC0" opacity="0.5"/>

  <!-- Section headline -->
  <rect x="48" y="116" width="220" height="22" rx="4" fill="#F7FAFC" opacity="0.9"/>
  <rect x="48" y="146" width="160" height="10" rx="3" fill="#718096" opacity="0.45"/>

  <!-- 3 Product cards -->
  <!-- Card 1 -->
  <rect x="48" y="174" width="218" height="240" rx="10" fill="#1E2A38"/>
  <rect x="48" y="174" width="218" height="128" rx="10" fill="#253345"/>
  <!-- Product image placeholder with icon -->
  <rect x="78" y="200" width="80" height="80" rx="8" fill="#2D3E50"/>
  <rect x="92" y="218" width="52" height="44" rx="4" fill="#56CCF2" opacity="0.25"/>
  <!-- Price badge -->
  <rect x="216" y="186" width="40" height="20" rx="10" fill="url(#g1)" transform="translate(-10,0)"/>
  <rect x="213" y="192" width="30" height="8" rx="2" fill="#0F1923" opacity="0.7"/>
  <!-- Product info -->
  <rect x="60" y="316" width="130" height="11" rx="3" fill="#F7FAFC" opacity="0.85"/>
  <rect x="60" y="334" width="90" height="8" rx="2" fill="#718096" opacity="0.5"/>
  <rect x="60" y="350" width="60" height="11" rx="3" fill="#56CCF2" opacity="0.85"/>
  <!-- Button -->
  <rect x="60" y="376" width="194" height="30" rx="15" fill="#253345" stroke="#56CCF2" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="100" y="384" width="114" height="8" rx="3" fill="#A0AEC0" opacity="0.5"/>

  <!-- Card 2 -->
  <rect x="291" y="174" width="218" height="240" rx="10" fill="#1E2A38"/>
  <rect x="291" y="174" width="218" height="128" rx="10" fill="#7B61FF" opacity="0.12"/>
  <rect x="321" y="200" width="80" height="80" rx="8" fill="#2D3E50"/>
  <rect x="335" y="218" width="52" height="44" rx="4" fill="#7B61FF" opacity="0.3"/>
  <rect x="459" y="186" width="40" height="20" rx="10" fill="url(#g1)" transform="translate(-10,0)"/>
  <rect x="456" y="192" width="30" height="8" rx="2" fill="#0F1923" opacity="0.7"/>
  <rect x="303" y="316" width="130" height="11" rx="3" fill="#F7FAFC" opacity="0.85"/>
  <rect x="303" y="334" width="90" height="8" rx="2" fill="#718096" opacity="0.5"/>
  <rect x="303" y="350" width="60" height="11" rx="3" fill="#56CCF2" opacity="0.85"/>
  <rect x="303" y="376" width="194" height="30" rx="15" fill="#253345" stroke="#56CCF2" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="343" y="384" width="114" height="8" rx="3" fill="#A0AEC0" opacity="0.5"/>
  <!-- Popular badge -->
  <rect x="291" y="174" width="80" height="22" rx="6" fill="#7B61FF"/>
  <rect x="301" y="180" width="60" height="8" rx="2" fill="#F7FAFC" opacity="0.85"/>

  <!-- Card 3 -->
  <rect x="534" y="174" width="218" height="240" rx="10" fill="#1E2A38"/>
  <rect x="534" y="174" width="218" height="128" rx="10" fill="#56CCF2" opacity="0.1"/>
  <rect x="564" y="200" width="80" height="80" rx="8" fill="#2D3E50"/>
  <rect x="578" y="218" width="52" height="44" rx="4" fill="#2BB5E0" opacity="0.3"/>
  <rect x="702" y="186" width="40" height="20" rx="10" fill="url(#g1)" transform="translate(-10,0)"/>
  <rect x="699" y="192" width="30" height="8" rx="2" fill="#0F1923" opacity="0.7"/>
  <rect x="546" y="316" width="130" height="11" rx="3" fill="#F7FAFC" opacity="0.85"/>
  <rect x="546" y="334" width="90" height="8" rx="2" fill="#718096" opacity="0.5"/>
  <rect x="546" y="350" width="60" height="11" rx="3" fill="#56CCF2" opacity="0.85"/>
  <rect x="546" y="376" width="194" height="30" rx="15" fill="#253345" stroke="#56CCF2" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="586" y="384" width="114" height="8" rx="3" fill="#A0AEC0" opacity="0.5"/>
